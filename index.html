<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Happy Hour</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=34" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1 class="hero-title">HAPPY<br />HOUR<span class="hero-dot">.</span></h1>
      <p class="hero-tagline">Never miss a deal again.</p>

      <a
        class="hero-credit"
        href="https://unsplash.com/photos/Lwx-q6OdGAc?utm_source=happy_hour_app&utm_medium=referral"
        target="_blank"
        rel="noopener"
        >Photo: Edgar Chaparro / Unsplash</a
      >
    </header>

    <section class="sheet">
      <div class="search-row">
        <div class="search-field">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search for restaurants…" autocomplete="off" />
        </div>
        <button id="filterBtn" class="filter-toggle-btn" aria-label="Filters">
          <span class="filter-toggle-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"></circle>
              <line x1="4" y1="18" x2="20" y2="18"></line>
              <circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"></circle>
            </svg>
          </span>
          <span id="filterCount" class="filter-count hidden">0</span>
        </button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Happening now</button>
        <button class="filter-btn" data-filter="upcoming">Upcoming</button>
        <button class="filter-btn" data-filter="datetime">Date &amp; Time</button>
      </div>

      <div id="listView">
        <section id="venueList" class="venue-list"></section>
      </div>

      <div id="mapView" class="map-view hidden">
        <div class="map-header">
          <div class="search-row">
            <div class="search-field">
              <span class="search-icon">🔍</span>
              <input type="text" id="mapSearchInput" placeholder="Search for restaurants…" autocomplete="off" />
            </div>
            <button id="mapFilterBtn" class="filter-toggle-btn" aria-label="Filters">
              <span class="filter-toggle-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"></circle>
              <line x1="4" y1="18" x2="20" y2="18"></line>
              <circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"></circle>
            </svg>
          </span>
              <span id="mapFilterCount" class="filter-count hidden">0</span>
            </button>
          </div>
          <div class="filters map-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Happening now</button>
            <button class="filter-btn" data-filter="upcoming">Upcoming</button>
            <button class="filter-btn" data-filter="datetime">Date &amp; Time</button>
          </div>
        </div>
        <div class="map-frame">
          <div id="map"></div>
        </div>
        <button id="mapLocateBtn" class="map-locate-btn" aria-label="Show my location">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="7"></circle>
            <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"></circle>
            <line x1="12" y1="1.5" x2="12" y2="5"></line>
            <line x1="12" y1="19" x2="12" y2="22.5"></line>
            <line x1="1.5" y1="12" x2="5" y2="12"></line>
            <line x1="19" y1="12" x2="22.5" y2="12"></line>
          </svg>
        </button>
        <div id="mapToast" class="map-toast hidden"></div>
        <p id="mapEmpty" class="empty-state hidden">None of your spots have map coordinates yet.</p>
        <div id="mapCardCarousel" class="map-card-carousel"></div>
      </div>
    </section>
  </div>

  <div class="bottom-nav">
    <button class="view-tab active" data-view="list">☰ List</button>
    <button class="view-tab" data-view="map">📍 Map</button>
  </div>


  <div id="filterModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Filters</h2>
        <button id="closeFilterModalBtn" class="btn-icon">&times;</button>
      </div>

      <div class="filter-toggle-list">
        <button type="button" class="filter-toggle-row" data-amenity="outdoor_seating">
          <span>🌳 Patio</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="gluten_free_options">
          <span>🌾 Gluten-free options</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="has_food">
          <span>🍽️ Food deals</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="has_drink">
          <span>🍸 Drink deals</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="near_transit">
          <span>🚇 Near transit</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="parking">
          <span>🅿️ Parking available</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="late_night">
          <span>🌙 Late-night happy hour</span>
          <span class="filter-toggle-check"></span>
        </button>
      </div>

      <div class="modal-actions">
        <button type="button" id="clearFiltersBtn" class="btn-secondary">Clear all</button>
        <div class="modal-actions-right">
          <button type="button" id="doneFiltersBtn" class="btn-primary">Done</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dateTimeModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Date &amp; Time</h2>
        <button id="closeDateTimeModalBtn" class="btn-icon">&times;</button>
      </div>

      <p class="daytime-hint">Find spots open at a day and time you're planning for — not a specific date.</p>

      <label class="daytime-label">Day</label>
      <div class="daytime-day-picker" id="dateTimeDayPicker">
        <button type="button" class="daytime-day-btn" data-day="0">Sun</button>
        <button type="button" class="daytime-day-btn" data-day="1">Mon</button>
        <button type="button" class="daytime-day-btn" data-day="2">Tue</button>
        <button type="button" class="daytime-day-btn" data-day="3">Wed</button>
        <button type="button" class="daytime-day-btn" data-day="4">Thu</button>
        <button type="button" class="daytime-day-btn" data-day="5">Fri</button>
        <button type="button" class="daytime-day-btn" data-day="6">Sat</button>
      </div>

      <label class="daytime-label">Time</label>
      <div class="daytime-time-picker" id="dateTimeTimePicker">
        <button type="button" class="daytime-time-btn daytime-time-slot" data-time="16:00">
          <span class="daytime-time-slot-name">Afternoon</span>
          <span class="daytime-time-slot-range">2–6pm</span>
        </button>
        <button type="button" class="daytime-time-btn daytime-time-slot" data-time="21:00">
          <span class="daytime-time-slot-name">Late Night</span>
          <span class="daytime-time-slot-range">9pm+</span>
        </button>
        <select id="dateTimeCustomTime" class="daytime-time-btn daytime-time-custom" aria-label="Custom time">
          <option value="" disabled selected>Custom</option>
          <option value="00:00">12am</option>
          <option value="01:00">1am</option>
          <option value="02:00">2am</option>
          <option value="03:00">3am</option>
          <option value="04:00">4am</option>
          <option value="05:00">5am</option>
          <option value="06:00">6am</option>
          <option value="07:00">7am</option>
          <option value="08:00">8am</option>
          <option value="09:00">9am</option>
          <option value="10:00">10am</option>
          <option value="11:00">11am</option>
          <option value="12:00">12pm</option>
          <option value="13:00">1pm</option>
          <option value="14:00">2pm</option>
          <option value="15:00">3pm</option>
          <option value="16:00">4pm</option>
          <option value="17:00">5pm</option>
          <option value="18:00">6pm</option>
          <option value="19:00">7pm</option>
          <option value="20:00">8pm</option>
          <option value="21:00">9pm</option>
          <option value="22:00">10pm</option>
          <option value="23:00">11pm</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" id="dateTimeClearBtn" class="btn-secondary">Clear</button>
        <div class="modal-actions-right">
          <button type="button" id="dateTimeApplyBtn" class="btn-primary">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <footer class="site-footer">
    <a href="spots/index.html">Browse all spots A–Z</a>
  </footer>

  <script src="app.js?v=53"></script>
</body>
</html>
