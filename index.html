<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Happy Hour</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=24" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1 class="hero-title">HAPPY<br />HOUR<span class="hero-dot">.</span></h1>
      <p class="hero-tagline">Never miss a deal again.</p>

      <a
        class="hero-credit"
        href="https://unsplash.com/photos/Lwx-q6OdGAc?utm_source=happy_hour_app&utm_medium=referral"
        target="_blank"
        rel="noopener"
        >Photo: Edgar Chaparro / Unsplash</a
      >
    </header>

    <section class="sheet">
      <div class="search-row">
        <div class="search-field">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search for restaurants…" autocomplete="off" />
        </div>
        <button id="filterBtn" class="filter-toggle-btn" aria-label="Filters">
          <span class="filter-toggle-icon">⚙</span>
          <span id="filterCount" class="filter-count hidden">0</span>
        </button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Happening now</button>
        <button class="filter-btn" data-filter="upcoming">Upcoming</button>
      </div>

      <div id="listView">
        <section id="venueList" class="venue-list"></section>
      </div>

      <div id="mapView" class="map-view hidden">
        <div class="map-header">
          <div class="search-row">
            <div class="search-field">
              <span class="search-icon">🔍</span>
              <input type="text" id="mapSearchInput" placeholder="Search for restaurants…" autocomplete="off" />
            </div>
            <button id="mapFilterBtn" class="filter-toggle-btn" aria-label="Filters">
              <span class="filter-toggle-icon">⚙</span>
              <span id="mapFilterCount" class="filter-count hidden">0</span>
            </button>
          </div>
          <div class="filters map-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Happening now</button>
            <button class="filter-btn" data-filter="upcoming">Upcoming</button>
          </div>
        </div>
        <div class="map-frame">
          <div id="map"></div>
        </div>
        <button id="mapLocateBtn" class="map-locate-btn" aria-label="Show my location">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="7"></circle>
            <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"></circle>
            <line x1="12" y1="1.5" x2="12" y2="5"></line>
            <line x1="12" y1="19" x2="12" y2="22.5"></line>
            <line x1="1.5" y1="12" x2="5" y2="12"></line>
            <line x1="19" y1="12" x2="22.5" y2="12"></line>
          </svg>
        </button>
        <div id="mapToast" class="map-toast hidden"></div>
        <p id="mapEmpty" class="empty-state hidden">None of your spots have map coordinates yet.</p>
        <div id="mapCardCarousel" class="map-card-carousel"></div>
      </div>
    </section>
  </div>

  <div class="bottom-nav">
    <button class="view-tab active" data-view="list">☰ List</button>
    <button class="view-tab" data-view="map">📍 Map</button>
  </div>

  <div id="venueModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add a Spot</h2>
        <button id="closeModalBtn" class="btn-icon">&times;</button>
      </div>
      <form id="venueForm">
        <input type="hidden" id="venueId" />

        <label>Name</label>
        <input type="text" id="venueName" placeholder="e.g. The Tipsy Fox" required />

        <label>Address (optional)</label>
        <input type="text" id="venueAddress" placeholder="e.g. 123 Main St" />

        <label>Phone (optional)</label>
        <input type="text" id="venuePhone" placeholder="e.g. 604 239 9304" />

        <label>Days</label>
        <div class="day-picker" id="dayPicker">
          <button type="button" class="day-btn" data-day="0">Sun</button>
          <button type="button" class="day-btn" data-day="1">Mon</button>
          <button type="button" class="day-btn" data-day="2">Tue</button>
          <button type="button" class="day-btn" data-day="3">Wed</button>
          <button type="button" class="day-btn" data-day="4">Thu</button>
          <button type="button" class="day-btn" data-day="5">Fri</button>
          <button type="button" class="day-btn" data-day="6">Sat</button>
        </div>

        <div class="time-row">
          <div>
            <label>Start Time</label>
            <input type="time" id="startTime" required />
          </div>
          <div>
            <label>End Time</label>
            <input type="time" id="endTime" required />
          </div>
        </div>

        <label>Deals</label>
        <div id="dealsList" class="deals-edit-list"></div>
        <button type="button" id="addDealBtn" class="btn-secondary">+ Add Deal</button>

        <div class="modal-actions">
          <button type="button" id="deleteVenueBtn" class="btn-danger hidden">Delete</button>
          <div class="modal-actions-right">
            <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Save Spot</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="filterModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Filters</h2>
        <button id="closeFilterModalBtn" class="btn-icon">&times;</button>
      </div>

      <div class="filter-toggle-list">
        <button type="button" class="filter-toggle-row" data-amenity="outdoor_seating">
          <span>🌳 Patio</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="gluten_free_options">
          <span>🌾 Gluten-free options</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="has_food">
          <span>🍽️ Food deals</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="has_drink">
          <span>🍸 Drink deals</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="near_transit">
          <span>🚇 Near transit</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="parking">
          <span>🅿️ Parking available</span>
          <span class="filter-toggle-check"></span>
        </button>
        <button type="button" class="filter-toggle-row" data-amenity="late_night">
          <span>🌙 Late-night happy hour</span>
          <span class="filter-toggle-check"></span>
        </button>
      </div>

      <div class="modal-actions">
        <button type="button" id="clearFiltersBtn" class="btn-secondary">Clear all</button>
        <div class="modal-actions-right">
          <button type="button" id="doneFiltersBtn" class="btn-primary">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <footer class="site-footer">
    <a href="spots/index.html">Browse all spots A–Z</a>
  </footer>

  <script src="app.js?v=40"></script>
</body>
</html>
