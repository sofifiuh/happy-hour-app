<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Happy Hour Menu</title>
<link rel="stylesheet" href="styles.css?v=17" />
<link rel="stylesheet" href="menu.css?v=5" />
</head>
<body>
  <div class="menu-app">
    <div class="menu-photo" id="menuPhoto">
      <a href="index.html" class="menu-back" aria-label="Back">‹</a>
      <div class="menu-photo-icon" id="menuPhotoIcon">🍹</div>
      <a class="menu-photo-credit hidden" id="menuPhotoCredit" target="_blank" rel="noopener"></a>
      <button type="button" class="menu-photo-counter" id="menuPhotoCounter">1/1</button>
    </div>

    <div class="menu-info">
      <h1 class="menu-name" id="venueName">Venue name</h1>
      <a class="menu-address" id="venueAddress" target="_blank" rel="noopener"></a>
      <a class="menu-phone" id="venuePhone"></a>
      <p id="verifiedBadge" class="menu-verified hidden">
        <a id="verifiedLink" target="_blank" rel="noopener">✓ Verified against official menu</a>
      </p>

      <div id="amenitiesList" class="menu-amenities hidden"></div>

      <div class="menu-tabs" id="menuTabs">
        <button class="menu-tab active" data-cat="food">Food</button>
        <button class="menu-tab" data-cat="drink">Drinks</button>
      </div>

      <div id="dealsList" class="menu-deals-list"></div>
    </div>

    <div id="galleryOverlay" class="gallery-overlay hidden">
      <button type="button" class="gallery-close" id="galleryClose" aria-label="Close gallery">✕</button>
      <div class="gallery-track" id="galleryTrack"></div>
      <div class="gallery-counter" id="galleryCounter">1/1</div>
      <button type="button" class="gallery-nav gallery-prev" id="galleryPrev" aria-label="Previous photo">‹</button>
      <button type="button" class="gallery-nav gallery-next" id="galleryNext" aria-label="Next photo">›</button>
    </div>

    <div class="menu-schedule-section">
      <h2>Happy Hour Times</h2>
      <div id="scheduleList" class="menu-schedule-list"></div>
      <a id="suggestUpdateLink" class="menu-suggest-link">Suggest an update</a>
    </div>

    <div class="menu-sticky-bar" id="stickyBar">
      <span class="menu-hours" id="hoursLabel">Hours</span>
      <button class="menu-share-btn" id="shareBtn">Share</button>
    </div>

    <div class="menu-map-section">
      <h2>Find us here</h2>
      <div class="menu-map-frame">
        <iframe
          id="mapFrame"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
      <a id="mapLink" class="menu-map-link" target="_blank" rel="noopener">Open in Maps</a>
    </div>

    <div id="notFound" class="empty-state hidden">
      Spot not found. <a href="index.html">Back to list</a>
    </div>
  </div>

  <div id="toast" class="menu-toast hidden">Link copied</div>

  <script src="venues-data.js?v=4"></script>
  <script src="menu.js?v=6"></script>
</body>
</html>
