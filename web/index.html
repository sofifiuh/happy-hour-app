<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f1e7" media="(prefers-color-scheme: light)" />
    <!-- Light or dark before first paint: the pick from Filters, else the system setting (src/lib/use-media.ts). -->
    <script>(function(d){var t;try{t=localStorage.getItem("theme")}catch(e){}var s=t==="light"||t==="dark"?t:matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";d.documentElement.dataset.theme=s;if(t)d.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=s==="light"?"#f5f1e7":"#1b1b1b"})})(document)</script>
    <meta name="description" content="Happy hours near you, right now. Real deals from 450+ Vancouver bars and restaurants." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="venues.json" as="fetch" crossorigin="anonymous" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Little Hang" />
    <meta property="og:title" content="A Little Hang: happy hours near you, right now" />
    <meta property="og:description" content="Live happy hour times and deals from 450+ Vancouver bars and restaurants." />
    <meta property="og:image" content="https://alittlehang.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>A Little Hang</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
