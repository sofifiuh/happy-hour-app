name: Deploy venue API (Cloudflare)

# Builds and deploys api/ (the Cloudflare Worker behind venue claiming,
# editing, stats and reports). Pull requests only type-check.
#
# Needs repo secrets CLOUDFLARE_API_TOKEN (Workers, D1, R2 edit) and
# CLOUDFLARE_ACCOUNT_ID. Email: set the repo variable EMAIL_PROVIDER to
# "cloudflare" (Cloudflare Email Service), or add the secret RESEND_API_KEY.
# Optional secret SIGNING_KEY (made automatically on the first deploy if
# absent). Optional repo variable API_DOMAIN (e.g. api.alittlehang.com,
# once that zone is on Cloudflare); without it
# the Worker answers on its workers.dev address.
#
# The first run creates the D1 database and R2 bucket, so nobody has to
# copy ids by hand.

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

      - name: Check Cloudflare keys
        id: keys
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the database and bucket if missing
        if: steps.keys.outputs.ready == 'true'
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="alh") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create alh
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="alh") | .uuid')
          fi
          test -n "$id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler r2 bucket list | grep -q "alittlehang-files" || npx wrangler r2 bucket create alittlehang-files

      - name: Use the custom domain
        if: steps.keys.outputs.ready == 'true' && vars.API_DOMAIN != ''
        run: |
          printf '\nroutes = [{ pattern = "%s", custom_domain = true }]\n' "${{ vars.API_DOMAIN }}" > routes.toml
          # Top-level keys must come before the first [table].
          { cat routes.toml; cat wrangler.toml; } > w.toml && mv w.toml wrangler.toml
          sed -i "s#^API_URL = .*#API_URL = \"https://${{ vars.API_DOMAIN }}\"#" wrangler.toml

      # Cloudflare Email Service (needs Workers Paid and the domain on
      # Cloudflare DNS). Otherwise mail goes through Resend.
      - name: Use Cloudflare Email Service
        if: steps.keys.outputs.ready == 'true' && vars.EMAIL_PROVIDER == 'cloudflare'
        run: printf '\n[[send_email]]\nname = "EMAIL"\nremote = true\n' >> wrangler.toml

      - name: Apply database migrations
        if: steps.keys.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply alh --remote

      - name: Deploy
        if: steps.keys.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Set secrets
        if: steps.keys.outputs.ready == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          [ -n "$RESEND_API_KEY" ] && printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY || true
          # Without a SIGNING_KEY secret, make one once and keep it.
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | npx wrangler secret put SIGNING_KEY
          elif ! npx wrangler secret list | grep -q '"SIGNING_KEY"'; then
            openssl rand -hex 32 | tr -d '\n' | npx wrangler secret put SIGNING_KEY
          fi
