# Proposed replacement for .github/workflows/deploy.yml (NOT applied).
# Builds web/ into a static site and publishes web/dist-site to GitHub Pages.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            photos
            web/public/photos
            web/node_modules/.cache/og
          key: site-media-${{ hashFiles('venues.json') }}
          restore-keys: site-media-
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run photos
      - working-directory: web
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
