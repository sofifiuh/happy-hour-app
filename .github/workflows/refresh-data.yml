name: Refresh venue data

# Daily: re-check every venue's own happy hour page, re-extract the ones
# that changed (needs ANTHROPIC_API_KEY), discover new venues and drop
# permanently closed ones (needs GOOGLE_PLACES_API_KEY too), re-stamp trust
# badges, commit the data to main and redeploy. See pipeline/README.md ("Freshness & trust").
on:
  schedule:
    - cron: "23 10 * * *" # 03:23 Vancouver (PDT), before the site's daily build
  # PRs touching the pipeline get a check-only dry run (nothing is committed).
  pull_request:
    paths: ["pipeline/**", ".github/workflows/refresh-data.yml"]
  workflow_dispatch:
    inputs:
      max_extract:
        description: "Max venues to re-extract this run"
        default: "40"
      force:
        description: "Run even if today's refresh already happened"
        type: boolean
        default: false
      burst:
        description: "Catch-up run: up to 160 Text + 160 Nearby searches from the month's free 900 (not the even daily share), publish up to 400"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Accept the common names for each key, so a differently named secret
      # still works.
      HAS_CLAUDE_KEY: ${{ (secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_KEY || secrets.CLAUDE_KEY || secrets.CLAUDE_CODE_OAUTH_TOKEN) != '' }}
      HAS_PLACES_KEY: ${{ (secrets.GOOGLE_PLACES_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.PLACES_API_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_PLACES_KEY || secrets.GOOGLE_KEY || secrets.MAPS_API_KEY || secrets.GMAPS_API_KEY || secrets.GOOGLE_CLOUD_API_KEY) != '' }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      # Check out main as it is now, not the commit that triggered the run:
      # a run queued behind another (the late cron behind the safety net's
      # dispatch) must see that run's data and Places ledger, or it redoes
      # the day on stale data, re-spends the Google budget and fails to push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      # One refresh a day. GitHub's cron lands hours late, so the safety net
      # sometimes dispatches first and the cron run queues behind it; that
      # second run stops here. A manual dispatch with force still runs.
      - name: Skip if today's refresh already ran
        if: github.event_name != 'pull_request' && inputs.force != true && inputs.burst != true
        run: |
          if grep -q "^| $(date -u +%F) |" pipeline/GROWTH.md; then
            echo "Today's refresh already ran (pipeline/GROWTH.md); skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Keys available
        if: env.SKIP != 'true'
        run: echo "Claude key set=$HAS_CLAUDE_KEY, Google Places key set=$HAS_PLACES_KEY"

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: 22

      - name: Install pipeline deps + Chromium
        if: env.SKIP != 'true'
        working-directory: pipeline
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y poppler-utils >/dev/null

      - name: Install Claude Code (extraction engine)
        if: env.HAS_CLAUDE_KEY == 'true' && env.DRY_RUN != 'true' && env.SKIP != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Refresh
        if: env.SKIP != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_KEY || secrets.CLAUDE_KEY }}
          # The Claude GitHub app's token works too; the CLI reads it directly.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.PLACES_API_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_PLACES_KEY || secrets.GOOGLE_KEY || secrets.MAPS_API_KEY || secrets.GMAPS_API_KEY || secrets.GOOGLE_CLOUD_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
          # Happy hours guests sent in and an admin published (pipeline/submissions.js).
          API_URL: ${{ vars.VITE_API_URL }}
        run: >-
          node pipeline/refresh.js --max-extract "${{ inputs.max_extract || '40' }}"
          ${{ env.DRY_RUN == 'true' && '--no-extract' || '--discover' }}
          --discover-target "${{ inputs.burst && '400' || vars.DISCOVER_TARGET || '60' }}"
          --discover-budget "${{ inputs.burst && '100' || vars.DISCOVER_BUDGET || '15' }}"
          ${{ inputs.burst && '--discover-searches 160' || '' }}

      - name: Commit data
        id: commit
        if: env.DRY_RUN != 'true' && env.SKIP != 'true'
        run: |
          git config user.name "a-little-hang-data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # api-usage.json is the per-SKU monthly Places ledger. Left uncommitted it
          # resets every night, the caps never bite, and Text Search ran past
          # its free 5,000 in Oct 2026.
          git add venues.json pipeline/freshness.json pipeline/discovered.json pipeline/places.json pipeline/screened.json pipeline/photos.json pipeline/submissions.json pipeline/api-usage.json pipeline/sweep-state.json pipeline/candidate-pool.json pipeline/GROWTH.md spots sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No data changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "data: daily refresh $(date -u +%F)"
          # Other scratch files the run touched (photo store, caches) are not
          # data; set them aside so the rebase onto a moving main can't fail.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The Places ledger and the discovery cursor record calls already made.
      # If the run fails after discovery (the sanity gate keeps venue data out),
      # still keep those three, or a re-run would re-spend the day's budget.
      - name: Keep the Places ledger on failure
        if: failure() && env.DRY_RUN != 'true' && env.SKIP != 'true'
        run: |
          git config user.name "a-little-hang-data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/api-usage.json pipeline/sweep-state.json pipeline/candidate-pool.json
          git diff --cached --quiet && exit 0
          git commit -m "data: Places ledger after a failed refresh $(date -u +%F)"
          git stash --include-untracked >/dev/null || true
          git pull --rebase origin main
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so
      # redeploy explicitly.
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != 'true'
        with:
          name: refresh-logs
          path: |
            pipeline/results/*.json
            pipeline/freshness.json
            venues.json
          if-no-files-found: ignore
